name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17 for Android Gradle
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Capacitor dependencies
        run: npm install

      - name: Generate Android project & sync www/index.html
        run: |
          npx cap add android
          npx cap sync android

      - name: Build Signed Installable APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Ready APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AetherBox-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
